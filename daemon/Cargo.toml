[package]
name = "fido-bridged"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
mdns-sd = "0.21.6"
nix = { version = "0.31.3", features = ["ioctl"] }
qrcode = { version = "0.14.1", features = ["svg"] }
rand = "0.10.3"
rcgen = "0.14.10"
rustls = { version = "0.23.46", features = ["std", "tls12", "ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "0.18.1"
